<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VPShelf · 服务器总览</title><link rel="stylesheet" href="/style.css"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><script defer src="/i18n.js"></script><script defer src="/app.js"></script><script defer src="/dropdowns.js"></script></head><body><main><header><div class="brand"><span class="logo">▤</span> VPShelf <span class="tag">PERSONAL INFRASTRUCTURE</span><a class="repo-link" href="https://github.com/lizhichaox/vpshelf" target="_blank" rel="noopener noreferrer" aria-label="VPShelf on GitHub">GitHub <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M6 3H3v10h10v-3M8 3h5v5M7 9l6-6"/></svg></a></div><div class="actions"><select id="language" aria-label="Language / 语言" data-i18n-label="Language / 语言"><option value="auto" data-i18n>自动 / Auto</option><option value="zh">中文</option><option value="en">English</option></select><span class="collection-note" title="流量以厂商计费周期为准" data-i18n-title="流量以厂商计费周期为准" data-i18n>指标 1 分钟 · 云信息 10 分钟 · 安全 15 分钟</span><span id="updated">等待采集</span><button id="refresh" data-i18n>刷新视图 ↻</button><button id="auth" data-i18n>访问密钥</button></div></header><div id="error" role="alert" hidden></div><section id="summary" class="summary"></section><section class="panel"><div class="toolbar"><h2><span data-i18n>服务器</span> <span id="count"></span></h2><div class="filters"><input id="search" aria-label="搜索服务器" data-i18n-label="搜索服务器" placeholder="搜索名称、地区或主机…" data-i18n-placeholder="搜索名称、地区或主机…"><select id="provider" aria-label="服务商筛选" data-i18n-label="服务商筛选"><option value="" data-i18n>全部服务商</option><option value="bandwagon">Bandwagon</option><option value="lightsail">AWS Lightsail</option><option value="aliyun" data-i18n>阿里云 ECS</option><option value="generic" data-i18n>其他服务器</option></select></div></div><div id="servers"></div></section></main><dialog id="detail" aria-labelledby="detail-title"><div class="dialog-head"><div><h2 id="detail-title"></h2><div id="detail-subtitle" class="sub"></div></div><button id="close" data-i18n>关闭 ✕</button></div><div class="detail-tabs" role="tablist" aria-label="Details"><button id="detail-overview-tab" role="tab" aria-controls="overview-panel" aria-selected="true" data-panel="overview" data-i18n>概览</button><button id="detail-security-tab" role="tab" aria-controls="security-panel" aria-selected="false" tabindex="-1" data-panel="security"><span data-i18n>安全检查</span><span id="detail-security-status"></span></button></div><section id="overview-panel" role="tabpanel" aria-labelledby="detail-overview-tab"><div class="trend-header"><span data-i18n>最近 24 小时</span><div class="legend"><span>● CPU</span><span data-i18n>● 内存</span><span class="sub">%</span></div></div><svg id="chart" viewBox="0 0 800 220" preserveAspectRatio="none" role="img" aria-label="最近 24 小时 CPU 和内存趋势" data-i18n-label="最近 24 小时 CPU 和内存趋势"></svg><p id="history-note"></p><div id="details"></div></section><section id="security-panel" role="tabpanel" aria-labelledby="detail-security-tab" hidden><div id="security-details"></div></section></dialog><dialog id="login"><h2 data-i18n>访问密钥</h2><p data-i18n>输入启动控制台显示的面板访问口令。</p><form id="login-form"><input id="token" type="password" autocomplete="off" aria-label="访问密钥" data-i18n-label="访问密钥"><label class="remember"><input id="remember-token" type="checkbox" checked><span data-i18n>在此浏览器记住口令</span></label><div class="login-actions"><button type="button" id="forget-token" data-i18n>忘记口令</button><button type="button" id="login-cancel" data-i18n>取消</button><button type="submit" data-i18n>连接</button></div></form></dialog></body></html>
