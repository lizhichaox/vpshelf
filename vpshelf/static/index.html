<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>VPShelf · 服务器总览</title><link rel="stylesheet" href="/style.css"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><script defer src="/i18n.js"></script><script defer src="/app.js"></script></head><body><main><header><div class="brand"><span class="logo">▤</span> VPShelf <span class="tag">PERSONAL INFRASTRUCTURE</span></div><div class="actions"><select id="language" aria-label="Language / 语言" data-i18n-label="Language / 语言"><option value="auto" data-i18n>自动 / Auto</option><option value="zh">中文</option><option value="en">English</option></select><span id="updated">等待采集</span><button id="refresh" data-i18n>刷新视图 ↻</button><button id="auth" data-i18n>访问密钥</button></div></header><section class="intro"><div><div class="eyebrow">YOUR SERVERS, ONE SHELF</div><h1 data-i18n>每台服务器，心中有数。</h1><p data-i18n>运行状态、资源负载与流量余额，在一处掌握。</p></div><span class="local" data-i18n>● 私有配置 · 只读采集</span></section><div id="error" role="alert" hidden></div><section id="summary" class="summary"></section><section class="panel"><div class="toolbar"><h2><span data-i18n>服务器</span> <span id="count"></span></h2><div class="filters"><input id="search" aria-label="搜索服务器" data-i18n-label="搜索服务器" placeholder="搜索名称、地区或主机…" data-i18n-placeholder="搜索名称、地区或主机…"><select id="provider" aria-label="服务商筛选" data-i18n-label="服务商筛选"><option value="" data-i18n>全部服务商</option><option value="bandwagon">Bandwagon</option><option value="lightsail">AWS Lightsail</option><option value="aliyun" data-i18n>阿里云 ECS</option><option value="generic" data-i18n>其他服务器</option></select></div></div><div id="servers"></div></section><footer>VPShelf <span data-i18n>运行指标每分钟采集 · 云信息默认每 10 分钟更新 · 流量以厂商计费周期为准</span></footer></main><dialog id="detail"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close" data-i18n>关闭 ✕</button></div><p data-i18n>最近 24 小时 · CPU / 内存使用率（%）</p><div class="legend"><span>● CPU</span><span data-i18n>● 内存</span></div><svg id="chart" viewBox="0 0 800 220" role="img" aria-label="最近 24 小时 CPU 和内存趋势" data-i18n-label="最近 24 小时 CPU 和内存趋势"></svg><p id="history-note"></p><div id="details"></div></dialog><dialog id="login"><h2 data-i18n>访问密钥</h2><p data-i18n>输入启动控制台显示的面板访问口令。</p><form id="login-form"><input id="token" type="password" autocomplete="off" aria-label="访问密钥" data-i18n-label="访问密钥"><label class="remember"><input id="remember-token" type="checkbox" checked><span data-i18n>在此浏览器记住口令</span></label><div class="login-actions"><button type="button" id="forget-token" data-i18n>忘记口令</button><button type="button" id="login-cancel" data-i18n>取消</button><button type="submit" data-i18n>连接</button></div></form></dialog></body></html>
