name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python -c "from alibabacloud_ecs20140526.client import Client; from alibabacloud_tea_util.models import RuntimeOptions; import boto3"
      - run: node --check vpshelf/static/app.js
